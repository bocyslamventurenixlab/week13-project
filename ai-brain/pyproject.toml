[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-ai-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "langgraph>=0.2,<1",
]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]
